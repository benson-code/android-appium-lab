[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    smoke: run first; the app starts and the main navigation works
    navigation: moving between screens, scrolling
    input: text fields and form controls
    boundary: empty, longest and other edge values
    dialog: dialogs
    gesture: drag, swipe and other gestures
    lifecycle: background, restore, restart
    stability: crashes and ANRs (monkey, logcat)
    case_id(id): test case ID (used by --target_case_ids)
