name: CI

# The same tests as the local redroid runs, on the Android emulator (API 34, x86_64).
# GitHub's x64 Linux runners provide KVM, which the emulator needs; the ARM64 runners do not.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appium:
    name: Appium tests on the Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Third-party and GitHub actions are pinned to a commit SHA, not a movable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Python requirements, Appium and the UiAutomator2 driver
        run: |
          pip install -r requirements.txt
          npm install -g appium@3.8.0
          appium driver install uiautomator2@8.7.0

      - name: Download the app under test (pinned, SHA-256 verified)
        run: tools/fetch_apk.sh

      - name: Give the runner access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the emulator and run the tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: tools/ci_run_tests.sh

      - name: Upload reports, failure evidence and logcat
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appium-reports
          path: reports/
          if-no-files-found: ignore
